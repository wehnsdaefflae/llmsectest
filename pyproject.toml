[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmsectest"
version = "0.2.0"
description = "A pytest-native security testing framework for LLM applications (OWASP LLM Top 10)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mark Wernsdorfer" }]
keywords = ["llm", "security", "pytest", "owasp", "sarif", "red-team"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Pytest",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["pytest>=7.4.0"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.39"]
huggingface = ["huggingface_hub>=0.25"]
# Optional CVSS v4.0 scoring of arbitrary vectors. The core ships baked scores
# for the ten canonical OWASP-category vectors, so this extra is only needed to
# score custom vectors. Note: `cvss` is LGPLv3+ — kept as an external optional
# dependency, never vendored into this MIT tree.
cvss = ["cvss>=3.0"]
all = ["openai>=1.0", "anthropic>=0.39", "huggingface_hub>=0.25", "cvss>=3.0"]
# The dev toolchain is pinned to major ranges on purpose. An unpinned linter or
# coverage tool redefines what "clean" and "covered" mean between releases without a
# commit of ours (ruff 0.16.0 did exactly that on 2026-07-24), and our own LLM03
# scanner flags every unpinned dependency here as a finding against this repo.
#
# `coverage` replaces `pytest-cov` here (2026-07-29). pytest-cov's only entry point is
# `pytest --cov`, which cannot measure this package correctly — pytest imports our
# pytest11 plugin before pytest-cov starts, so the number lands ~24 points low. Shipping
# the plugin would only invite that wrong measurement; `coverage run -m pytest` is both
# correct and one dependency lighter.
# `openai` and `httpx` are here as TEST dependencies, not as anything the shipped
# package needs at runtime: `dependencies` above stays at `pytest` alone. Until 2026-08-21 they
# were absent, and 23 tests carrying `pytest.importorskip("openai")` therefore skipped
# in every CI run on every Python: the openai adapter, and with it `ollama` and
# `lmstudio`, which subclass it and are what the daily cohort actually runs on. The
# test written to prove our 429 matcher is aimed at the class the vendor really raises
# had never executed in CI either. `check_no_test_skipped_for_missing_dep` in
# bin/closeout.py now fails when a test importorskips something this list does not
# provide, so a silently-skipped suite cannot come back.
dev = [
    "pytest>=7.4.0",
    "coverage>=7.6,<8",
    "ruff>=0.16,<0.17",
    "mypy>=1.11,<2",
    "cvss>=3.0",
    "openai>=1.0",
    "httpx>=0.27",
]
# mkdocs is pinned <2: the upstream "MkDocs 2.0" is a backward-incompatible, currently
# unlicensed rewrite (TOML config, plugin/theme system removed, no migration path); the
# maintained line is Material for MkDocs on mkdocs 1.x. Pinning keeps `mkdocs gh-deploy`
# reproducible until we evaluate a successor (Zensical reads mkdocs.yml natively).
docs = ["mkdocs<2", "mkdocs-material>=9.7,<10", "mkdocstrings[python]>=1.0"]

[project.scripts]
llmsectest = "llmsectest.__main__:main"

[project.entry-points.pytest11]
llmsectest = "llmsectest.plugin"

[project.urls]
Homepage = "https://llmsec.dev"
Documentation = "https://docs.llmsec.dev"
Repository = "https://github.com/wehnsdaefflae/llmsectest"

[tool.hatch.build.targets.wheel]
packages = ["src/llmsectest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Measure coverage with `coverage run -m pytest`, NOT `pytest --cov`.
#
# This package registers a pytest11 entry point, so pytest imports `llmsectest`
# while loading plugins — before pytest-cov starts measuring. Every module reached
# on that path (the package __init__, plugin.py, and their imports) then has its
# module-level statements recorded as never executed. Measured 2026-07-29: the same
# green suite reports 48% via `pytest --cov` and 72% via `coverage run -m pytest`.
# The lower number is an artifact of import order, not untested code, so the
# canonical invocation is the one below, which starts coverage before pytest loads.
#
#   coverage run -m pytest && coverage report
#
[tool.coverage.run]
source = ["llmsectest"]
branch = true

[tool.coverage.report]
# The floor ratchets: raise it when a run legitimately lifts coverage, never lower it
# to make a red build green. It exists to stop a slow slide, not to chase 100%.
#
# Ratchet against the LOWEST Python in the CI matrix, not your local interpreter.
# 2026-08-04: raised 75 -> 78 on a local 3.12 measurement of 79%, and CI went red the
# same push because 3.11 measures 77% on the identical tree. Verify the claim on the
# surface you are claiming it about: run `coverage report` under the oldest supported
# version before moving this number, and leave a point of margin so one uncovered line
# in an unrelated change does not break the build.
#
# 2026-08-05: 76 -> 78, and this time measured the documented way rather than locally.
# A throwaway 3.11 venv built with CI's own command (`pip install -e ".[dev,cvss]"`)
# reports 79% on this tree, against 80% on local 3.12.
#
# 2026-08-21: 78 -> 84, and the *reason* recorded above turns out to be wrong, which is
# worth more than the new number. The interpreter contributes nothing. Measured three
# ways on one tree: 3.11 with CI's install reports 84% (563 passed, 23 skipped); add
# `openai` and `httpx` and the same 3.11 reports 85% with 586 passed and nothing skipped,
# at 3926/502/1294/148 — the identical figures local 3.12 produces. So the CI/local gap
# was never a version difference. It was 23 tests skipping on a missing test dependency,
# every one of them on the openai/ollama/lmstudio adapter path. Both deps are in the dev
# extra now, so CI measures 85 and this floor keeps the one point of margin.
#
# The whole matrix was measured before moving the floor, not just its oldest member,
# because that is the mistake this note is about: throwaway venvs on 3.11, 3.12 and 3.13
# all report 586 passed and 3926/502/1294/148, byte for byte. The interpreter spread on
# this tree is zero.
#
# The rule the note above states still stands, and it is the one that found this:
# measure with CI's install command, not with your own environment.
fail_under = 84
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
omit = [
    # The packaged probe suite only executes against a live target (a model or an
    # app endpoint), so a unit run can never enter it — it is exercised end-to-end
    # by the integration cohort instead. Counting it here would measure how much of
    # the product needs a GPU, not how much of it is untested.
    "*/llmsectest/suite/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# The rule set is declared explicitly on purpose. Ruff's *default* selection changes
# between releases (0.16.0 widened it), so an unpinned linter silently redefines what
# "clean" means and turns a green branch red without a single line of code changing.
# Config decides the rules; the `ruff>=0.16,<0.17` pin in the dev extra decides the tool.
[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors (E501 line length is left to the formatter)
    "F",               # pyflakes
    "I",               # import sorting
    "UP",              # pyupgrade — we require Python >= 3.11
    "B",               # bugbear
    "C4",              # comprehensions
    "SIM",             # simplify
    "ISC",             # implicit string concatenation (the missing-comma footgun)
    "PIE",
    "PLE",             # pylint errors only
    "RUF",
    "DTZ",             # timezone-aware datetimes
]
ignore = [
    # A tool that *detects* Unicode-confusable evasion necessarily contains confusables:
    # the fullwidth/homoglyph characters in `probes/detectors.py` and the typographic
    # apostrophe in its refusal phrases are detection data, not typos.
    "RUF001", "RUF002", "RUF003",
    # `Role` is public API. `class Role(str, Enum)` and `enum.StrEnum` differ in what
    # `str(Role.USER)` returns, so switching base classes would change observable
    # behaviour for consumers to gain nothing they can use.
    "UP042",
]
# Blind `except Exception` is deliberate where we isolate a failure: one broken report
# format, optional dependency, or provider SDK must not abort a scan. BLE001 is therefore
# not selected rather than papered over with per-line noqa.
