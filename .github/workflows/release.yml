name: release

# Validates a release when a v* tag is pushed. It does NOT publish on a tag today: the
# `publish` job below is `workflow_dispatch` only, because releases currently go out from a
# workstation with an API token. Flip that condition and drop the token the day a trusted
# publisher is configured, and this header becomes true again.
#
# When it does run, it uses PyPI Trusted Publishing (OIDC) and no API token: PyPI is told, once,
# that this repository's `release` workflow running in the `pypi` environment is allowed
# to upload `llmsectest`, and GitHub mints a short-lived credential per run. There is no
# long-lived secret to store, leak, or rotate, which for a security tool is the point.
#
# Setup on PyPI, once, by the account owner:
#   PyPI → Your projects → llmsectest → Publishing  (or, before the first release,
#   Account settings → Publishing → Add a pending publisher)
#     Owner: wehnsdaefflae   Repository: llmsectest
#     Workflow: release.yml  Environment: pypi
#
# Then: git tag v0.2.0 && git push origin v0.2.0  (runs check + build; publish is manual)

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # The tag says a version; the package has to agree. A mismatch here is cheap to fix and
  # expensive on PyPI, where a filename can never be reused even after a delete.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev,cvss]"
      - run: ruff check src tests examples
      - run: coverage run -m pytest -q
      - run: coverage report
      - name: the tag and the version in pyproject must match
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag pyproject=$pkg"
          test "$tag" = "$pkg"

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      # Install the built wheel in a clean interpreter and drive the real CLI, because a
      # package that imports is not the same as a package that works: `--target
      # demo-defended` is fully offline and exits 0, so it is a genuine end-to-end check.
      - name: the wheel has to install and run
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/llmsectest --version
          /tmp/smoke/bin/llmsectest --check
          /tmp/smoke/bin/llmsectest --target demo-defended
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  # Manual dispatch only, deliberately. Mark chose to publish with an API token from a
  # workstation (2026-08-21), so this job would fail on a tag push: Trusted Publishing is
  # not configured on PyPI, and by the time a tag exists the version is usually already
  # uploaded, which PyPI rejects because a filename can never be reused. A red X on the
  # repository's front page is a bad first impression bought for nothing.
  #
  # `check` and `build` still run on every tag, and they are the parts with teeth: they
  # prove the tag matches the version in pyproject and that the wheel installs and scans
  # in a clean interpreter. Flip this to the tag trigger the day a trusted publisher is
  # configured, and drop the token.
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the OIDC token Trusted Publishing exchanges; nothing else
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      # Pinned to a commit rather than to the moving `release/v1` branch: this step
      # holds the OIDC token that can publish to PyPI under our name, so it is the
      # one action here where a silent upstream change matters most. The SHA is the
      # head of `release/v1` on 2026-09-05, which is the commit tagged v1.14.2.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          skip-existing: true
