name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "src/llmsectest/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "src/llmsectest/**"]
  workflow_dispatch: {}

# The default token is read-only unless a job asks for more. CodeQL's
# actions/missing-workflow-permissions flagged the `build` job below on
# 2026-09-05; `deploy` was already declaring its own. With no block at all a
# job inherits whatever the repository default is, which is a property of the
# settings page rather than of this file.
permissions:
  contents: read

jobs:
  # Always validate the docs build (strict catches broken refs + autodoc).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict

  # Publish to GitHub Pages — manual trigger only, so docs never auto-publish.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -e ".[docs]"
      - run: mkdocs gh-deploy --force
