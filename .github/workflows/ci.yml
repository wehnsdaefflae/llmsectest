name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  # A tool or dependency release can break the build with no commit of ours involved
  # (ruff 0.16.0's widened default rule set did exactly that). Push-triggered CI can
  # only discover that on the next push; a weekly run surfaces the drift on its own.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,cvss]"
      - run: ruff check src tests
      # `coverage run -m pytest`, not `pytest --cov`: this package is a pytest11
      # plugin, so pytest imports it before pytest-cov starts measuring and the
      # --cov number comes out ~24 points low. See the note in pyproject.toml.
      # The floor lives in [tool.coverage.report] fail_under.
      - run: coverage run -m pytest -q
      - run: coverage report

  # The tool must actually run, not just pass unit tests: scan the offline
  # hardened demo (exit 0, no findings) and validate the SARIF it emits.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install -e ".[cvss]"
      - run: llmsectest --check
      - run: llmsectest --target demo-defended
      - run: llmsectest --target demo-defended --validate
